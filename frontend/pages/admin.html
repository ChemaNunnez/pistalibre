<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PistaLibre - Administración</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<header class="app-header">
    <div class="logo-header">
        <img src="../assets/img/pistalibre-logo.png" alt="Logo PistaLibre">
        <span>PistaLibre</span>
    </div>

    <nav>
        <a href="dashboard.html">Inicio</a>
        <a href="calendario.html">Pistas</a>
        <a href="mis_reservas.html">Mis reservas</a>
        <a href="admin.html">Admin</a>
        <button id="btnLogout">Cerrar sesión</button>
    </nav>
</header>

<main class="dashboard-container">

    <section class="welcome-card">
        <h2>Panel de Administración</h2>
        <p>Gestión básica de usuarios del sistema.</p>
    </section>

    <section class="tabla-card">
        <div class="seccion-cabecera">
            <h3>Usuarios registrados</h3>
            <button id="btnToggleUsuarios">Mostrar / Ocultar</button>
        </div>

        <div id="panelUsuarios" style="display:none;">
            <div class="filtros-admin">
                <input type="text" id="buscadorUsuarios" placeholder="Buscar por nombre, alias o email">

                <select id="filtroRol">
                    <option value="todos">Todos los roles</option>
                    <option value="admin">Admin</option>
                    <option value="profesor">Profesor</option>
                    <option value="usuario">Usuario</option>
                </select>
            </div>

            <div id="usuariosAdmin">Cargando usuarios...</div>
        </div>
        
    </section>

    <section class="tabla-card">
        <div class="seccion-cabecera">
            <h3>Reservas fijas</h3>
            <button id="btnToggleReservasFijas">
                Mostrar / Ocultar
            </button>
        </div>

        <div id="panelReservasFijas" style="display:none;">

            <input
                type="text"
                id="buscadorReservasFijas"
                placeholder="Buscar profesor, pista o deporte"
            >

            <div id="reservasFijasAdmin">
                Cargando reservas...
            </div>

        </div>
    </section>

    <div id="modalDetalleReservaFija" class="modal" style="display:none;">
    <div class="modal-content">
        <h3>Detalle de reserva fija</h3>
        <div id="detalleReservaFija"></div>
        <button id="btnCerrarDetalleReservaFija">Cerrar</button>
    </div>
</div>

<div id="modalLiberar" class="modal" style="display:none;">
    <div class="modal-content">
        <h3>Liberar clase</h3>

        <input type="hidden" id="idReservaFijaLiberar">
        <input type="hidden" id="idProfesorLiberar">

        <label>Fecha</label>
        <input type="date" id="fechaLiberar">

        <label>Motivo</label>
        <input type="text" id="motivoLiberar">

        <button id="btnConfirmarLiberar">Confirmar</button>
        <button id="btnCancelarLiberar">Cancelar</button>
    </div>
</div>

<div id="modalExtra" class="modal" style="display:none;">
    <div class="modal-content">
        <h3>Crear recuperación de clase</h3>

        <input type="hidden" id="idReservaFijaExtra">
        <input type="hidden" id="idProfesorExtra">

        <label>Pista</label>
        <select id="pistaExtra"></select>

        <label>Fecha</label>
        <input type="date" id="fechaExtra">

        <label>Hora inicio</label>
        <input type="time" id="horaInicioExtra">

        <label>Hora fin</label>
        <input type="time" id="horaFinExtra">

        <label>Observaciones</label>
        <input type="text" id="observacionesExtra">

        <button id="btnConfirmarExtra">Confirmar</button>
        <button id="btnCancelarExtra">Cancelar</button>
    </div>
</div>

</main>

<script src="../js/admin.js"></script>
</body>
</html>
